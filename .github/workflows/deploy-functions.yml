name: Deploy Aletheia Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-functions.yml"
      - "functions/**"
      - "src/lib/commerce/offerings.ts"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALETHEIA_WORLD }}
          project_id: aletheia-world

      - name: Deploy Cloud Functions
        run: npx -y firebase-tools@latest deploy --only functions --project aletheia-world --non-interactive
