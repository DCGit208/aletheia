name: One Source Migration QA

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "Book Matter/One Source of Truth/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/one-source-migration-qa.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Access and offer tests
        run: npm test
