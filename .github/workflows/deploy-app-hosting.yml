name: Deploy Aletheia App to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-app-hosting.yml"
      - "src/**"
      - "functions/**"
      - "scripts/generate-protected-content.cjs"
      - "public/**"
      - "Book Matter/One Source of Truth/**"
      - "Book Matter/Doctrine of Faith/**"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - ".firebaserc"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "scripts/check-one-source-migration.mjs"
      - "scripts/check-doctrine-of-faith-publication.mjs"
      - "scripts/check-protected-content-build.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-app
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical manuscript parity
        run: node scripts/check-one-source-migration.mjs

      - name: Verify Doctrine of Faith publication integrity
        run: node scripts/check-doctrine-of-faith-publication.mjs

      - name: Validate public Firebase web configuration
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          test -n "$NEXT_PUBLIC_FIREBASE_API_KEY" || { echo "::error::NEXT_PUBLIC_FIREBASE_API_KEY is missing from GitHub Actions repository variables."; exit 1; }
          test -n "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" || { echo "::error::NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN is missing from GitHub Actions repository variables."; exit 1; }
          test -n "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" || { echo "::error::NEXT_PUBLIC_FIREBASE_PROJECT_ID is missing from GitHub Actions repository variables."; exit 1; }
          test -n "$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" || { echo "::error::NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET is missing from GitHub Actions repository variables."; exit 1; }
          test -n "$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" || { echo "::error::NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID is missing from GitHub Actions repository variables."; exit 1; }
          test -n "$NEXT_PUBLIC_FIREBASE_APP_ID" || { echo "::error::NEXT_PUBLIC_FIREBASE_APP_ID is missing from GitHub Actions repository variables."; exit 1; }
          if [ "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" != "aletheia-world" ]; then
            echo "::error::NEXT_PUBLIC_FIREBASE_PROJECT_ID must be aletheia-world."
            exit 1
          fi

      - name: Build app for Firebase Hosting
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_CHECKOUT_MODE: stripe
          NEXT_PUBLIC_ENABLE_LOCAL_DEMO_MODE: "false"
        run: npm run build:hosting

      - name: Install Firebase Functions dependencies
        run: npm --prefix functions ci

      - name: Build and test protected-content function
        run: npm --prefix functions test

      - name: Authenticate for Firebase Functions deployment
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALETHEIA_WORLD }}

      - name: Deploy protected-content function
        run: npx -y firebase-tools@latest deploy --only functions:aletheia:getProtectedContent --project aletheia-world

      - name: Verify anonymous Book I preview access
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://us-central1-aletheia-world.cloudfunctions.net/getProtectedContent";
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ data: { kind: "book", contentId: "book-doctrine-of-faith" } }),
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(JSON.stringify(payload));
          const chapters = payload.result?.chapters;
          if (!Array.isArray(chapters) || chapters.length !== 1 || chapters[0]?.id !== "ch-faith-1") {
            throw new Error("Anonymous Book I access must return Chapter 1 only.");
          }
          console.log("Anonymous Book I access verified: Chapter 1 only.");
          NODE

      - name: Deploy only app.aletheiaworld.org
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALETHEIA_WORLD }}
          projectId: aletheia-world
          target: aletheia-world
          channelId: live

      - name: Verify live Book I catalogue page and cover
        run: |
          node --input-type=module <<'NODE'
          const url = "https://app.aletheiaworld.org/publications/books/book-doctrine-of-faith";
          const response = await fetch(url, { redirect: "follow" });
          if (!response.ok) throw new Error(`Book I page returned HTTP ${response.status}.`);
          const html = await response.text();
          if (!html.includes("The Doctrine of Faith")) throw new Error("Book I title is missing from the live catalogue page.");
          if (!html.includes("doctrine-of-faith-seal.png")) throw new Error("The original Book I cover is missing from the live catalogue page.");
          console.log("Live Book I catalogue page, title, and original cover verified.");
          const readerUrl = "https://app.aletheiaworld.org/learn/read/book-doctrine-of-faith?chapter=ch-faith-1";
          const readerResponse = await fetch(readerUrl, { redirect: "follow" });
          if (!readerResponse.ok) throw new Error(`Book I reader route returned HTTP ${readerResponse.status}.`);
          console.log("Live Book I reader route responds successfully.");
          NODE
